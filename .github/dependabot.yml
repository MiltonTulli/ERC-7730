version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Action v2 needs @changesets/cli 3. The version job still uses CLI 2.
      - dependency-name: "changesets/action"
        update-types:
          - "version-update:semver-major"
