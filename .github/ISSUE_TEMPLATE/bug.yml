name: Bug
description: A defect in the SDK, the CLI, or the docs
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search open issues first. Security reports go to SECURITY.md, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: "@erc7730/sdk 0.9.1"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A short code sample, a CLI command, or a link.
    validations:
      required: true
