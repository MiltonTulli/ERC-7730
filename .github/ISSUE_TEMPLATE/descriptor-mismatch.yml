name: Descriptor mismatch
description: A decode result does not match the descriptor you expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Include the call, the descriptor, and the output you expected. Protocol metadata changes belong on ethereum/clear-signing-erc7730-registry.
  - type: textarea
    id: tx
    attributes:
      label: Transaction or typed data
      description: chainId, to, data, and value, or the full typed-data object.
    validations:
      required: true
  - type: textarea
    id: descriptor
    attributes:
      label: Descriptor
      description: Official registry path, or the JSON passed to extend().
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected output
      description: Intent, fields, source, and confidence.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual output
    validations:
      required: true
