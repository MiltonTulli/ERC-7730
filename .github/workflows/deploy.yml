name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "packages/docs/**"
      - "packages/web/**"
      - "packages/sdk/**"
      - "packages/cli/**"
      - "packages/registry/**"
      - "docs/**"
      - ".github/workflows/deploy.yml"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Astro 7 / Starlight require Node >= 22.12
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (sdk, cli, web, registry)
        run: pnpm build

      - name: Build docs site + mount demo
        run: pnpm --filter @erc7730/docs build:site

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/docs/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
