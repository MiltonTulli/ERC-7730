name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 1.9.0

      - name: Run Biome
        run: biome ci .

  build-and-test:
    name: Build & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Type check (after build)
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: CLI pack smoke
        run: node scripts/cli-pack-smoke.mjs

      - name: Check package exports
        run: |
          cd packages/sdk
          node -e "import('@erc7730/sdk').then(m => console.log('SDK exports:', Object.keys(m)))"

      - name: publint + attw
        working-directory: packages/sdk
        run: |
          pnpm exec publint
          # SDK is ESM-only (type: module, export conditions are import/types).
          # attw 0.18 has no optional-peer-dependency rule; esm-only skips node10/CJS.
          pnpm exec attw --pack . --profile esm-only

  golden-python:
    name: Golden python-erc7730
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python-erc7730
        run: pip install erc7730==1.0.11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check resolve/lint goldens
        run: pnpm golden:python

  changeset:
    name: Changeset (when SDK or CLI source changes)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a changeset for SDK/CLI source or package.json changes
        run: |
          git fetch origin main --depth=1
          CHANGED=$(git diff --name-only origin/main...HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          PUBLISHED_TOUCHED=$(echo "$CHANGED" | grep -E '^(packages/sdk/src/|packages/sdk/package.json$|packages/cli/src/|packages/cli/package.json$)' || true)
          CHANGESETS=$(echo "$CHANGED" | grep -E '^\.changeset/.+\.md$' | grep -v 'README.md' || true)
          if [ -n "$PUBLISHED_TOUCHED" ] && [ -z "$CHANGESETS" ]; then
            echo "::error::SDK or CLI source/package.json changed without a .changeset/*.md file. Run: pnpm changeset"
            exit 1
          fi
          echo "Changeset check passed."
