name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 1.9.0

      - name: Run Biome
        run: biome ci .

  build-and-test:
    name: Build & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Type check (after build)
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: SDK coverage
        run: pnpm --filter @erc7730/sdk test:coverage

      - name: Upload SDK coverage
        uses: actions/upload-artifact@v4
        with:
          name: sdk-coverage-node-${{ matrix.node }}
          path: packages/sdk/coverage/lcov.info
          if-no-files-found: error

      - name: Check SDK bundle graph
        run: node scripts/check-sdk-bundles.mjs

      - name: CLI pack smoke
        run: node scripts/cli-pack-smoke.mjs

      - name: publint + attw
        working-directory: packages/sdk
        run: |
          pnpm exec publint
          # SDK is ESM-only (type: module, export conditions are import/types).
          # attw --profile esm-only skips the node10/CJS checks.
          pnpm exec attw --pack . --profile esm-only

  consumer-install:
    name: Consumer install (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        # tsdown imports unrun, which fails on Node 20. The repo engines
        # field is >=22.18. The matrix below only installs the packed tarball.
        run: pnpm --filter @erc7730/sdk build

      - name: Setup consumer Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Consumer install
        run: node scripts/sdk-consumer-install.mjs

  golden-python:
    name: Golden python-erc7730
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python-erc7730
        run: pip install erc7730==1.0.11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check resolve/lint goldens
        run: pnpm golden:python

  docs:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Astro 7 / Starlight require Node >= 22.12
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (sdk, cli, web, registry)
        run: pnpm build

      - name: Build docs site
        run: pnpm --filter @erc7730/docs build:site

  playground:
    name: Playground
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @erc7730/sdk build

      - name: Install Playwright browser
        run: pnpm --filter @erc7730/web exec playwright install --with-deps chromium

      - name: Playground end to end
        run: pnpm --filter @erc7730/web test:e2e

  changeset:
    name: Changeset (when SDK or CLI source changes)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a changeset for SDK/CLI source or package.json changes
        run: |
          git fetch origin main --depth=1
          CHANGED=$(git diff --name-only origin/main...HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          PUBLISHED_TOUCHED=$(echo "$CHANGED" | grep -E '^(packages/sdk/src/|packages/sdk/package.json$|packages/cli/src/|packages/cli/package.json$|packages/[^/]+/tsdown\.config\.ts$|packages/sdk/scripts/)' | grep -vE '/__tests__/' || true)
          CHANGESETS=$(echo "$CHANGED" | grep -E '^\.changeset/.+\.md$' | grep -v 'README.md' || true)
          if [ -n "$PUBLISHED_TOUCHED" ] && [ -z "$CHANGESETS" ]; then
            echo "::error::SDK or CLI source/package.json changed without a .changeset/*.md file. Run: pnpm changeset"
            exit 1
          fi
          echo "Changeset check passed."
