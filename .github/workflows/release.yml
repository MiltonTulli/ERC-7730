name: Release

on:
  push:
    branches: [main, next]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release-channels
  cancel-in-progress: false

jobs:
  version:
    name: Open Version PR
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has_changesets: ${{ steps.detect.outputs.has_changesets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect pending changesets
        id: detect
        run: |
          if [ -f .changeset/pre.json ] && [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "Exit prerelease mode in a reviewed promotion PR before merging to main"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" = "next" ] && [ -f .changeset/pre.json ]; then
            node --input-type=module -e 'import {readFileSync} from "node:fs"; import {releaseChannel} from "./scripts/release-policy.mjs"; releaseChannel("next", JSON.parse(readFileSync(".changeset/pre.json")));'
          fi
          PENDING=$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -print)
          if [ -n "$PENDING" ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
            echo "Pending changesets:"
            echo "$PENDING"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
            echo "No pending changesets"
          fi

      - name: Disable git hooks
        if: steps.detect.outputs.has_changesets == 'true'
        run: git config core.hooksPath /dev/null

      # Publishing stays in the job below. This step only opens the version PR.
      # v2 ignores GITHUB_TOKEN from the environment; pass github-token instead.
      - name: Open or update Version PR
        if: steps.detect.outputs.has_changesets == 'true'
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          version-script: pnpm version-packages
          create-github-releases: false
          push-git-tags: false
        env:
          HUSKY: "0"

  publish:
    name: Publish packages
    needs: version
    if: needs.version.outputs.has_changesets == 'false' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Enable npm Trusted Publishing (OIDC)
        run: |
          npm install -g npm@11
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi
          unset NODE_AUTH_TOKEN

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard release channel, cadence and promotion; snapshot npm tags
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-guard.mjs preflight

      - name: Build, typecheck, test
        run: |
          pnpm build
          pnpm typecheck
          pnpm test
          node scripts/check-nested-quantifiers.mjs
          node scripts/check-doc-snippets.mjs
          pnpm --filter @erc7730/sdk api:report
          git diff --exit-code -- api
          node scripts/check-sdk-bundles.mjs
          node scripts/sdk-consumer-install.mjs
          node scripts/cli-pack-smoke.mjs

      - name: Pack and inspect tarball
        if: steps.guard.outputs.sdk_publish == 'true'
        working-directory: packages/sdk
        run: |
          VERSION="${{ steps.guard.outputs.sdk_version }}"
          TARBALL="erc7730-sdk-${VERSION}.tgz"
          npm pack
          if [ ! -f "$TARBALL" ]; then
            echo "Expected $TARBALL from pack"
            ls -la *.tgz || true
            exit 1
          fi
          echo "Tarball contents:"
          tar -tzf "$TARBALL"
          if tar -tzf "$TARBALL" | grep -E '(/src/|/__tests__/|\.test\.|/test/|\.map$)'; then
            echo "Tarball includes source, tests, or sourcemaps"
            exit 1
          fi
          echo "Tarball looks clean: $TARBALL"

      - name: Publish to npm
        env:
          RELEASE_CHANNEL: ${{ steps.guard.outputs.channel }}
        if: steps.guard.outputs.sdk_publish == 'true'
        working-directory: packages/sdk
        run: |
          VERSION="${{ steps.guard.outputs.sdk_version }}"
          npm publish "erc7730-sdk-${VERSION}.tgz" --access public --provenance --tag "$RELEASE_CHANNEL"

      - name: Fetch published SDK tarball (release recovery)
        if: steps.guard.outputs.sdk_publish != 'true' && steps.guard.outputs.sdk_release == 'true'
        working-directory: packages/sdk
        env:
          VERSION: ${{ steps.guard.outputs.sdk_version }}
        run: npm pack "@erc7730/sdk@${VERSION}"

      - name: Resolve SDK publication commit
        id: sdk_commit
        if: steps.guard.outputs.sdk_release == 'true'
        working-directory: packages/sdk
        env:
          VERSION: ${{ steps.guard.outputs.sdk_version }}
          PUBLISH: ${{ steps.guard.outputs.sdk_publish }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            if ! printf '%s' "$GITHUB_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "GITHUB_SHA is not a commit: $GITHUB_SHA"
              exit 1
            fi
            echo "publication_commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ROOT=$(git rev-parse --show-toplevel)
          COMMIT=$("$ROOT/scripts/resolve-publication-commit.sh" "erc7730-sdk-${VERSION}.tgz" "@erc7730/sdk" "$VERSION")
          echo "publication_commit=${COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Pack CLI tarball
        if: steps.guard.outputs.cli_publish == 'true'
        working-directory: packages/cli
        env:
          VERSION: ${{ steps.guard.outputs.cli_version }}
        run: |
          TARBALL="erc7730-cli-${VERSION}.tgz"
          pnpm pack
          if [ ! -f "$TARBALL" ]; then
            echo "Expected $TARBALL from pack"
            ls -la *.tgz || true
            exit 1
          fi
          echo "Tarball contents:"
          tar -tzf "$TARBALL"
          if tar -tzf "$TARBALL" | grep -E '(/src/|/__tests__/|\.test\.|/test/|\.map$)'; then
            echo "Tarball includes source, tests, or sourcemaps"
            exit 1
          fi
          echo "Tarball looks clean: $TARBALL"

      - name: Publish @erc7730/cli
        if: steps.guard.outputs.cli_publish == 'true'
        working-directory: packages/cli
        env:
          RELEASE_CHANNEL: ${{ steps.guard.outputs.channel }}
          VERSION: ${{ steps.guard.outputs.cli_version }}
        run: |
          npm publish "erc7730-cli-${VERSION}.tgz" --access public --provenance --tag "$RELEASE_CHANNEL"

      - name: Fetch published CLI tarball (release recovery)
        if: steps.guard.outputs.cli_publish != 'true' && steps.guard.outputs.cli_release == 'true'
        working-directory: packages/cli
        env:
          VERSION: ${{ steps.guard.outputs.cli_version }}
        run: npm pack "@erc7730/cli@${VERSION}"

      - name: Resolve CLI publication commit
        id: cli_commit
        if: steps.guard.outputs.cli_release == 'true'
        working-directory: packages/cli
        env:
          VERSION: ${{ steps.guard.outputs.cli_version }}
          PUBLISH: ${{ steps.guard.outputs.cli_publish }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            if ! printf '%s' "$GITHUB_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "GITHUB_SHA is not a commit: $GITHUB_SHA"
              exit 1
            fi
            echo "publication_commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ROOT=$(git rev-parse --show-toplevel)
          COMMIT=$("$ROOT/scripts/resolve-publication-commit.sh" "erc7730-cli-${VERSION}.tgz" "@erc7730/cli" "$VERSION")
          echo "publication_commit=${COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Verify published packages, provenance and npm tags
        run: node scripts/release-guard.mjs verify

      - name: GitHub Release (SDK)
        if: steps.guard.outputs.sdk_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: sdk-v${{ steps.guard.outputs.sdk_version }}
          prerelease: ${{ steps.guard.outputs.channel == 'next' }}
          make_latest: ${{ steps.guard.outputs.channel == 'next' && 'false' || 'legacy' }}
          target_commitish: ${{ steps.sdk_commit.outputs.publication_commit }}
          name: "@erc7730/sdk v${{ steps.guard.outputs.sdk_version }}"
          body: |
            Package: `@erc7730/sdk`
            Version: `${{ steps.guard.outputs.sdk_version }}`
          append_body: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: packages/sdk/erc7730-sdk-${{ steps.guard.outputs.sdk_version }}.tgz

      - name: GitHub Release (CLI)
        if: steps.guard.outputs.cli_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: cli-v${{ steps.guard.outputs.cli_version }}
          prerelease: ${{ steps.guard.outputs.channel == 'next' }}
          make_latest: ${{ steps.guard.outputs.channel == 'next' && 'false' || 'legacy' }}
          target_commitish: ${{ steps.cli_commit.outputs.publication_commit }}
          name: "@erc7730/cli v${{ steps.guard.outputs.cli_version }}"
          body: |
            Package: `@erc7730/cli`
            Version: `${{ steps.guard.outputs.cli_version }}`
          append_body: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: packages/cli/erc7730-cli-${{ steps.guard.outputs.cli_version }}.tgz

      - name: Verify Git tags and GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-guard.mjs complete

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ github.sha }}
          path: .release-evidence/
          if-no-files-found: ignore
