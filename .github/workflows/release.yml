name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    name: Open Version PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has_changesets: ${{ steps.detect.outputs.has_changesets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect pending changesets
        id: detect
        run: |
          PENDING=$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -print)
          if [ -n "$PENDING" ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
            echo "Pending changesets:"
            echo "$PENDING"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
            echo "No pending changesets"
          fi

      - name: Disable git hooks
        if: steps.detect.outputs.has_changesets == 'true'
        run: git config core.hooksPath /dev/null

      - name: Open or update Version PR
        if: steps.detect.outputs.has_changesets == 'true'
        uses: changesets/action@v1
        with:
          title: "chore: version packages"
          commit: "chore: version packages"
          version: pnpm version-packages
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0"

  publish:
    name: Publish packages
    needs: version
    if: needs.version.outputs.has_changesets == 'false'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Enable npm Trusted Publishing (OIDC)
        run: |
          npm install -g npm@11
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi
          unset NODE_AUTH_TOKEN

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, typecheck, test
        run: |
          pnpm build
          pnpm typecheck
          pnpm test

      - name: Plan SDK publish and GitHub Release
        id: plan
        working-directory: packages/sdk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          PUBLISHED=$(npm view "@erc7730/sdk@${VERSION}" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Already on npm: @erc7730/sdk@$VERSION"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Will publish @erc7730/sdk@$VERSION"
          fi
          # Checked independently of npm so a failed release step is retried on the next run.
          if gh release view "sdk-v${VERSION}" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Release sdk-v$VERSION already exists"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Will create GitHub Release sdk-v$VERSION"
          fi

      - name: Pack and inspect tarball
        if: steps.plan.outputs.publish == 'true'
        working-directory: packages/sdk
        run: |
          VERSION="${{ steps.plan.outputs.version }}"
          TARBALL="erc7730-sdk-${VERSION}.tgz"
          npm pack
          if [ ! -f "$TARBALL" ]; then
            echo "Expected $TARBALL from npm pack"
            ls -la *.tgz || true
            exit 1
          fi
          echo "Tarball contents:"
          tar -tzf "$TARBALL"
          if tar -tzf "$TARBALL" | grep -E '(/src/|/__tests__/|\.test\.|/test/|\.map$)'; then
            echo "Tarball includes source, tests, or sourcemaps"
            exit 1
          fi
          echo "Tarball looks clean: $TARBALL"

      - name: Publish to npm
        if: steps.plan.outputs.publish == 'true'
        working-directory: packages/sdk
        run: |
          VERSION="${{ steps.plan.outputs.version }}"
          npm publish "erc7730-sdk-${VERSION}.tgz" --access public --provenance

      - name: Fetch published SDK tarball (release recovery)
        if: steps.plan.outputs.publish != 'true' && steps.plan.outputs.release == 'true'
        working-directory: packages/sdk
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: npm pack "@erc7730/sdk@${VERSION}"

      - name: GitHub Release (SDK)
        if: steps.plan.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sdk-v${{ steps.plan.outputs.version }}
          name: "@erc7730/sdk v${{ steps.plan.outputs.version }}"
          body: |
            Package: `@erc7730/sdk`
            Version: `${{ steps.plan.outputs.version }}`
          append_body: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: packages/sdk/erc7730-sdk-${{ steps.plan.outputs.version }}.tgz

      - name: Plan CLI publish and GitHub Release
        id: cli
        working-directory: packages/cli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" = "0.0.0" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "CLI is still 0.0.0 (waiting for Version PR)"
            exit 0
          fi
          PUBLISHED=$(npm view "@erc7730/cli@${VERSION}" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Already on npm: @erc7730/cli@$VERSION"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Will publish @erc7730/cli@$VERSION"
          fi
          # Checked independently of npm so a failed release step is retried on the next run.
          if gh release view "cli-v${VERSION}" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Release cli-v$VERSION already exists"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Will create GitHub Release cli-v$VERSION"
          fi

      - name: Pack CLI tarball
        if: steps.cli.outputs.publish == 'true'
        working-directory: packages/cli
        env:
          VERSION: ${{ steps.cli.outputs.version }}
        run: |
          TARBALL="erc7730-cli-${VERSION}.tgz"
          npm pack
          if [ ! -f "$TARBALL" ]; then
            echo "Expected $TARBALL from npm pack"
            ls -la *.tgz || true
            exit 1
          fi
          echo "Tarball contents:"
          tar -tzf "$TARBALL"
          if tar -tzf "$TARBALL" | grep -E '(/src/|/__tests__/|\.test\.|/test/|\.map$)'; then
            echo "Tarball includes source, tests, or sourcemaps"
            exit 1
          fi
          echo "Tarball looks clean: $TARBALL"

      - name: Publish @erc7730/cli
        if: steps.cli.outputs.publish == 'true'
        working-directory: packages/cli
        env:
          VERSION: ${{ steps.cli.outputs.version }}
        run: |
          npm publish "erc7730-cli-${VERSION}.tgz" --access public --provenance

      - name: Fetch published CLI tarball (release recovery)
        if: steps.cli.outputs.publish != 'true' && steps.cli.outputs.release == 'true'
        working-directory: packages/cli
        env:
          VERSION: ${{ steps.cli.outputs.version }}
        run: npm pack "@erc7730/cli@${VERSION}"

      - name: GitHub Release (CLI)
        if: steps.cli.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cli-v${{ steps.cli.outputs.version }}
          name: "@erc7730/cli v${{ steps.cli.outputs.version }}"
          body: |
            Package: `@erc7730/cli`
            Version: `${{ steps.cli.outputs.version }}`
          append_body: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: packages/cli/erc7730-cli-${{ steps.cli.outputs.version }}.tgz
