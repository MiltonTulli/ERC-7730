name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish @erc7730/sdk
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Enable npm Trusted Publishing (OIDC)
        run: |
          npm install -g npm@11
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi
          unset NODE_AUTH_TOKEN

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Version guard
        run: |
          TAG="${GITHUB_REF_NAME}"
          TAG="${TAG#v}"
          PKG=$(node -p "require('./packages/sdk/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag version $TAG != package.json $PKG"
            exit 1
          fi
          echo "Tag v$TAG matches packages/sdk/package.json $PKG"

      - name: Pack and inspect tarball
        working-directory: packages/sdk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TARBALL="erc7730-sdk-${VERSION}.tgz"
          npm pack
          if [ ! -f "$TARBALL" ]; then
            echo "Expected $TARBALL from npm pack"
            ls -la *.tgz || true
            exit 1
          fi
          echo "Tarball contents:"
          tar -tzf "$TARBALL"
          if tar -tzf "$TARBALL" | grep -E '(/src/|/__tests__/|\.test\.|/test/|\.map$)'; then
            echo "Tarball includes source, tests, or sourcemaps"
            exit 1
          fi
          echo "Tarball looks clean: $TARBALL"

      - name: Publish to npm
        working-directory: packages/sdk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm publish "erc7730-sdk-${VERSION}.tgz" --access public --provenance

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            packages/sdk/*.tgz
